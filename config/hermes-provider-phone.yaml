# Hermes Provider Config — Phone (via SSH Tunnel)
# Add this to your ~/.hermes/config.yaml
#
# IMPORTANT: The config.yaml file is protected from direct edits.
# Use Python to apply these changes:
#
#   import yaml
#   cfg = yaml.safe_load(open('/home/YOUR_USER/.hermes/config.yaml'))
#   cfg['providers']['phone'] = {
#       'base_url': 'http://127.0.0.1:18081/v1',
#       'api_key': 'phone-local',
#       'model': 'nvidia/NVIDIA-Nemotron3-Nano-4B-Q4_K_M',
#       'context_length': 4096
#   }
#   cfg.setdefault('model_catalog', {}).setdefault('providers', {})['phone'] = {
#       'base_url': 'http://127.0.0.1:18081/v1',
#       'models': ['nvidia/NVIDIA-Nemotron3-Nano-4B-Q4_K_M']
#   }
#   with open('/home/YOUR_USER/.hermes/config.yaml', 'w') as f:
#       yaml.dump(cfg, f, default_flow_style=False)
#
# Then restart the Hermes gateway.

# Add under the root-level `providers:` key:
providers:
  phone:
    base_url: http://127.0.0.1:18081/v1     # SSH tunnel to phone
    api_key: phone-local                      # Arbitrary (no auth on tunnel)
    model: nvidia/NVIDIA-Nemotron3-Nano-4B-Q4_K_M
    context_length: 4096

# Also add to model_catalog for the slash command dropdown:
model_catalog:
  providers:
    phone:
      base_url: http://127.0.0.1:18081/v1
      models:
        - nvidia/NVIDIA-Nemotron3-Nano-4B-Q4_K_M
